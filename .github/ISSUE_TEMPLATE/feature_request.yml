name: 功能建议
description: 提出新功能、体验改进或适配需求
title: '[建议] '
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出满区闹钟的功能建议。提交前可以先搜索已有 Issue，看看是否有人提出相同需求。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 说明实际使用场景，以及现在遇到的不便。
      placeholder: 例如：我想给工作日和周末分别设置不同的提醒声音……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或调整什么功能？
      description: 描述你希望怎样操作，以及预期看到的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他办法或参考
      description: 可填写目前的临时办法，或附上类似功能的截图、链接。
  - type: input
    id: environment
    attributes:
      label: 相关设备与版本（可选）
      placeholder: 手机型号、Android / 系统版本、满区闹钟版本
  - type: textarea
    id: additional
    attributes:
      label: 补充说明（可选）
